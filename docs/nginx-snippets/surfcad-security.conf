# Install on the Hostinger box as /etc/nginx/snippets/surfcad-security.conf
# Include from every nginx location that defines its own add_header (Cache-Control),
# because nginx does not merge server-level add_header into those locations.

# HSTS (HTTPS vhost only — do not include on plain HTTP redirects)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(self \"https://js.stripe.com\"), usb=()" always;

# SurfCAD SPA: self-hosted Vite bundle, WASM (Manifold + FEA workers),
# Monaco (@monaco-editor/loader defaults to https://cdn.jsdelivr.net/npm/monaco-editor@0.43.0/min/vs;
# CodeEditor does not call loader.config({ monaco }), so jsdelivr stays on the page CSP),
# Cloudflare Turnstile (partners), Stripe Elements (checkout), GitHub API (git sync), SendCutSend catalog.
# CAD worker chunks use surfcad-worker-csp.conf (connect-src 'none').
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://js.stripe.com https://cdn.jsdelivr.net https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' data: https://api.github.com https://cdn.sendcutsend.com https://api.stripe.com https://challenges.cloudflare.com https://*.stripe.com https://cdn.jsdelivr.net https://*.ingest.us.sentry.io https://us.i.posthog.com ws://127.0.0.1:17341 ws://localhost:17341; frame-src 'self' https://challenges.cloudflare.com https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
