# Install as /etc/nginx/snippets/surfcad-worker-csp.conf
# Pair with a location that matches the CAD sandbox worker entry, e.g.
#   location ~* /assets/sandboxWorker.*\.js$ { include .../surfcad-worker-csp.conf; }
#
# Chromium module workers inherit the document CSP, so this is
# defense-in-depth for browsers that apply the worker script's own policy.
# Do not use this snippet on the HTML document: the page still needs
# cdn.jsdelivr.net for @monaco-editor/loader.
# nginx does not merge add_header — this location must set the headers it needs.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'none'; worker-src 'none'" always;
