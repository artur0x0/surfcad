# Paste-ready replacement for /etc/nginx/sites-enabled/surfcad.com on Hostinger.
# Pair with docs/nginx-snippets/surfcad-security.conf → /etc/nginx/snippets/surfcad-security.conf
# Apply steps: docs/ops/nginx-headers.md

server {
    listen 80;
    listen [::]:80;
    server_name surfcad.com www.surfcad.com;
    return 301 https://$host$request_uri;
}

server {
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/surfcad.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/surfcad.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_name surfcad.com www.surfcad.com;

    # Include default MIME types
    include /etc/nginx/mime.types;

    root /var/www;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # COOP/COEP removed: FEA wasm is single-threaded (see src/workers/feaWorker.js); SharedArrayBuffer
    # is not required for the production app. Dropping COEP avoids blocking Turnstile and Stripe iframes.

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/surfcad-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # CAD sandbox worker: stricter CSP (connect-src none). More specific
    # than /assets/. Do not match the FEA worker.
    location ~* /assets/sandboxWorker.*\.js$ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/surfcad-worker-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Static asset handling
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/surfcad-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Don't log favicon.ico requests
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Proxy to backend — helmet sets security headers; do not duplicate them here.
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Don't serve hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error handling
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
