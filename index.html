<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/loading-theme.js"></script>
    <style>
      /* First-paint splash. Tokens match --brand-paper / --brand-navy in src/index.css. */
      html { --brand-paper: 250 250 249; --brand-navy: 15 23 42; }
      html[data-loading-theme="light"],
      html[data-loading-theme="light"] body {
        background-color: rgb(var(--brand-paper));
      }
      html[data-loading-theme="dark"],
      html[data-loading-theme="dark"] body {
        background-color: rgb(var(--brand-navy));
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SurfCAD" />
    <meta name="theme-color" content="#16171D" />
    <meta name="description" content="Don't do CAD. SurfCAD." />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SurfCAD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
