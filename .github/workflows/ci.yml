          if grep -q 'no system Chrome found' "${RUNNER_TEMP}/agent-bridge-flag.log"; then
            echo "agent harness flag golden skipped because Chrome was not found; CI must launch it"
            exit 1
          fi

      - name: Agent bridge state readers golden
