# Pull-request and default-branch CI.
#
# This workflow is not a required status check, and it does not touch branch
# protection. To require it later, add the job names below as required checks
# on the default branch (repository Settings → Rules → Rulesets, or Branch
# protection rules → Require status checks to pass):
#   - lint, build, unit
#   - golden app-loads
#   - license
#   - cargo-deny
#   - wasm freshness
#   - mesh wasm freshness
#   - calculix reference
# cargo-deny and wasm freshness run their real checks when
# packages/surfcad-fea is present. Mesh wasm freshness runs when
# packages/surfcad-mesh/pkg is present. If those files are absent the jobs
# skip and exit 0, because a skipped job would not satisfy a required check.
# GPL, AGPL, and LGPL fail the Rust license check because they are not in
# packages/surfcad-fea/deny.toml's allow list. The license job also rejects
# non-commercial npm licences and fails when public/THIRD_PARTY_NOTICES.txt
# does not match a fresh Rust and npm generation. CalculiX is GPL-2.0-only and
# is not a dependency. The calculix reference job installs the ccx binary
# with apt and runs it as an external process. It is never vendored, linked,
# bundled, or committed. If that install fails, the job emits a warning
# annotation and exits 0. A comparison that runs and misses a gate fails.
#
# Triggers are pull requests into main and pushes to main. There is no spark branch.
# If a step needs the repository name, use ${{ github.repository }}. Do not
# hard-code it; the remote may be renamed.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a run when a newer commit is pushed to the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast static checks. Share one npm ci. `npm run verify` is intentionally
  # absent: it calls an external cadgen-workspace gate that is not on the runner.
  check:
    name: lint, build, unit
    runs-on: ubuntu-latest
    # Volume-mesh tests call fTetWild (box, cylinder, plate, L-bracket, cantilever).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: backend npm ci
        run: npm ci --prefix backend

      # Clean on main. A failure here is a real regression, not a known baseline.
      - name: lint
        run: npm run lint

      - name: markdown link check
        run: npm run check:md-links

      - name: vite build
        run: npm run build

      - name: nginx config syntax (docs)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx openssl
          node scripts/ci/nginx-config-test.mjs

      # Bare `node --test` also matches scripts/golden/*playtest*, which are
      # browser goldens (the default pattern is *test*). The script keeps
      # the same explicit trees and leaves those goldens out:
      #   src/**/*.test.{js,mjs,cjs}
      #   test/**/*.{js,mjs,cjs}
      #   tests/**/*.{js,mjs,cjs}
      # FEA files run one at a time. Each file's --test-timeout covers that
      # whole file (Node applies it to the file, not only to one test). A
      # wall-clock kill a little later names the suite if the event loop is
      # blocked and that timeout cannot fire. Either way a hang stops short
      # of this job's 30 minute limit.
      - name: node --test
        run: node scripts/ci/run-unit-tests.mjs

      # Mock / fake-GitHub save goldens (no Chrome, no network). G2 used to
      # expect `Bracket (2).js` and is not covered by node --test.
      - name: git save goldens
        run: |
          node scripts/golden/smoke_git_g2_open_save.mjs
          node scripts/golden/smoke_git_save_stray.mjs
          node scripts/golden/smoke_git_g3_commit_push.mjs
          node scripts/golden/smoke_git_delete_from_repo.mjs
          node scripts/golden/smoke_git_assembly_rename_reload.mjs
          node scripts/golden/smoke_git_g7_real_adapter.mjs
          node scripts/golden/smoke_wc_identity_reload.mjs

      # Headless node, no Chrome: a kernel child process is pushed past its
      # memory cap and must report a fatal out_of_memory, then run again.
      - name: kernel crash headless golden
        run: |
          npm run golden:kernel-crash-headless | tee "${RUNNER_TEMP}/kernel-crash-headless.log"
          if ! grep -q 'kernel crash headless golden: ok' "${RUNNER_TEMP}/kernel-crash-headless.log"; then
            echo "kernel crash headless golden did not pass (see log above)"
            exit 1
          fi

      # Headless node, no Chrome: source-pin goldens that read the sources and
      # the pure helpers (cross-part subtract plan, assembly title and
      # overlays, failed-part outline wiring, shell face-pick compose). Each
      # exits non-zero on a failed check and prints its "passed" line.
      - name: source-pin goldens
        run: |
          for g in cross-part-clone assembly failed-part-outline shell-face-pick; do
            npm run "golden:$g" | tee "${RUNNER_TEMP}/$g.log"
            if ! grep -qi 'checks passed' "${RUNNER_TEMP}/$g.log"; then
              echo "$g golden did not pass (see log above)"
              exit 1
            fi
          done

      # Headless node, no Chrome. The opening overlay shows the assembly's
      # display name on the viewport ground, never the raw id or a preview.
      - name: assembly open overlay golden
        run: |
          npm run golden:assembly-open-spinner | tee "${RUNNER_TEMP}/assembly-open-spinner.log"
          if ! grep -q 'assembly open overlay golden: ok' "${RUNNER_TEMP}/assembly-open-spinner.log"; then
            echo "assembly open overlay golden did not pass (see log above)"
            exit 1
          fi

  # Cheapest existing golden that proves the bundle actually boots: a real
  # headless Chrome, vite preview, #root painted, canvas + toolbar + Run.
  # Pixel goldens are not in this job. Chrome comes from the runner via
  # setup-chrome; playwright-core does not download a browser. The script
  # exits 0 when CHROME_PATH is missing, so CI checks the binary first and
  # refuses that skip.
  #
  # Shots go to GOLDEN_SHOT_DIR (${{ runner.temp }}/golden) or os.tmpdir().
  # Never /opt/cursor/artifacts.
  smoke:
    name: golden app-loads
    runs-on: ubuntu-latest
    # 13 to 18 minutes on 2026-10-23 with every golden wired; the 20 minute
    # cap cancelled a green run mid-FEA once three more goldens landed.
    timeout-minutes: 40
    defaults:
      run:
        # bash -e does not fail a pipeline when the left side fails.
        # `node script | tee log` was exiting 0 and hiding golden failures.
        # FEA study panel opts back out: its pixel check already exits 1 on main.
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: vite build (production)
        run: npm run build

      - name: Verify production bundle omits playtest auto-approve
        run: node --test --test-name-pattern 'production dist bundle' test/agent-bridge-playtest-build.test.mjs

      - name: vite build (playtest)
        run: npm run build:playtest

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Agent bridge auto-approve guard (production)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          npm run build
          node --test --test-name-pattern 'localStorage auto-approve' test/agent-bridge-playtest-build.test.mjs
          npm run build:playtest

      - name: App-load golden
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          GOLDEN_SHOT_DIR: ${{ runner.temp }}/golden
        run: |
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          test -n "$GOLDEN_SHOT_DIR"
          mkdir -p "$GOLDEN_SHOT_DIR"
          "$CHROME_PATH" --version
          node scripts/ci/smoke_csp_app_loads.mjs | tee "${RUNNER_TEMP}/csp-smoke.log"
          if grep -q 'no system Chrome' "${RUNNER_TEMP}/csp-smoke.log"; then
            echo "CSP smoke skipped because Chrome was not found; CI must launch it"
            exit 1
          fi
          node scripts/golden/smoke_app_loads.mjs | tee "${RUNNER_TEMP}/app-loads.log"
          if grep -q 'no system Chrome found' "${RUNNER_TEMP}/app-loads.log"; then
            echo "app-load golden skipped because Chrome was not found; CI must launch it"
            exit 1
          fi

      # Flag off, the agent registry adds no window.surfcad and no host chrome.
      # Both widths. The build above is the one this step loads.
      - name: Agent harness flag-off golden
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          GOLDEN_SHOT_DIR: ${{ runner.temp }}/golden
        run: |
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          test -n "$GOLDEN_SHOT_DIR"
          mkdir -p "$GOLDEN_SHOT_DIR"
